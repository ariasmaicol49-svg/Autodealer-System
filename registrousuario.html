<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Usuario | Autodealer System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="indexadmin.html">Autodealer System</a>

        <nav class="nav" aria-label="Principal">
          <a href="indexadmin.html">Inicio</a>
          <a href="inventario.html">Inventario</a>
          <a href="usuarios.html">Usuarios</a>
          <a href="ventas.html">Ventas</a>
          <a href="index.html">Logout</a>
        </nav>
      </div>
    </header>

    <main>
      <a class="back" href="usuarios.html">← Volver a Usuarios</a>

      <section class="divcard">
        <p class="eyebrow">Módulo de usuarios</p>
        <h1>Registrar usuario</h1>
        <p class="muted"> Completa los campos obligatorios marcados con *.</p>

        <form id="customer-form" data-demo-form novalidate>
          <div class="grid">
            <div class="field">
              <label for="name">Nombre completo *</label>
              <input
                id="name"
                name="name"
                autocomplete="name"
                required
                maxlength="100"
                placeholder="Nombre y apellidos"
              >
            </div>

            <div class="field">
              <label for="document">Número de documento *</label>
              <input
                id="document"
                name="document"
                inputmode="numeric"
                required
                maxlength="20"
                placeholder="Documento de ejemplo"
              >
            </div>

            <div class="field">
              <label for="phone">Teléfono *</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                required
                maxlength="20"
                placeholder="Número de contacto"
              >
            </div>

            <div class="field">
              <label for="customer-email">Correo electrónico *</label>
              <input
                id="customer-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="cliente@correo.com"
              >
            </div>
          </div>

          <div class="message" aria-live="polite"></div>

          <div class="actions">
            <button type="submit">Validar y guardar</button>
            <a class="button secondary" href="usuarios.html">Cancelar</a>
          </div>
        </form>
      </section>
    </main>

      <footer class="carro-footer">
      <div class="carro-footer-inner">
        <div>
          <p class="carro-footer-copy">© 2026 Autodealer. Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>
  </body>
</html>

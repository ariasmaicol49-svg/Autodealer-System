<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Maqueta académica responsive de Autodealer System">
    <title>Registrar venta | Autodealer System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="indexadmin.html">Autodealer System</a>

        <nav class="nav" aria-label="Principal">
          <a href="indexadmin.html">Inicio</a>
          <a href="inventario.html">Inventario</a>
          <a href="usuarios.html">Usuarios</a>
          <a href="ventas.html">Ventas</a>
          <a href="index.html">Logout</a>
        </nav>
      </div>
    </header>

    <main>
      <a class="back" href="indexadmin.html">← Volver al inicio</a>

      <section class="divcard">
        <p class="eyebrow">Módulo de ventas</p>
        <h1>Registrar venta</h1>
        <p class="muted">
          Completa los campos obligatorios marcados con *.
        </p>

        <form id="vehicle-form" data-demo-form novalidate>
          <div class="grid">
            <div class="field">
              <label for="brand">Marca *</label>
              <input
                id="brand"
                name="brand"
                required
                maxlength="40"
                placeholder="Ej. Toyota"
              >
            </div>

            <div class="field">
              <label for="model">Modelo *</label>
              <input
                id="model"
                name="model"
                required
                maxlength="50"
                placeholder="Ej. Corolla"
              >
            </div>

            <div class="field">
              <label for="year">Año *</label>
              <input
                id="year"
                name="year"
                type="number"
                min="1900"
                max="2027"
                step="1"
                required
                placeholder="2024"
              >
            </div>

            <div class="field">
              <label for="price">Precio en pesos colombianos (COP) *</label>
              <input
                id="price"
                name="price"
                type="number"
                min="0"
                step="1000"
                required
                placeholder="75000000">
            </div>

            <div class="field">
              <label for="km">Kilometraje (km) *</label>
              <input
                id="km"
                name="km"
                type="number"
                min="0"
                step="1"
                required
                placeholder="25000"
              >
            </div>

            <div class="field">
              <label for="status">Estado *</label>
              <select id="status" name="status" required>
                <option value="">Selecciona un estado</option>
                <option>Disponible</option>
                <option>Reservado</option>
                <option>Vendido</option>
              </select>
            </div>

          <div class="field">
              <label for="color">Color *</label>
              <input
                id="color"
                name="color"
                type="text"
                required
                placeholder="Rojo"
              >
            </div>
             <div class="field">
              <label for="tipovehiculo">Tipo Vehiculo *</label>
              <select id="tipovehiculo" name="tipovehiculo" required>
                <option value="">Selecciona un tipo de vehículo</option>
                <option>Automóvil</option>
                <option>Motocicleta</option>
                <option>Camioneta</option>
              </select>
            </div>
            <div class="field">
              <label for="nombrecomprador">Nombre del comprador *</label>
              <input
                id="nombrecomprador"
                name="nombrecomprador"
                type="text"
                required
                placeholder="Juan Pérez"
              >
            </div>
             <div class="field">
              <label for="telefonousuario">Teléfono *</label>
              <input
                id="telefonousuario"
                name="telefonousuario"
                type="tel"
                autocomplete="tel"
                required
                maxlength="20"
                placeholder="Número de contacto"
              >
            </div>
            <div class="field">
              <label for="emailusuario">Correo electrónico *</label>
              <input
                id="emailusuario"
                name="emailusuario"
                type="email"
                autocomplete="email"
                required
                placeholder="cliente@correo.com"
              >
            </div>
             <div class="field">
              <label for="ciudadusuario">Ciudad *</label>
              <input
                id="ciudadusuario"
                name="ciudadusuario"
                type="text"
                required
                placeholder="Ciudad del comprador"
              >
            </div>
          </div>

          <div class="message" aria-live="polite"></div>

          <div class="actions">
            <button type="submit">Validar y guardar</button>
            <a class="button secondary" href="inventario.html">Cancelar</a>
          </div>
        </form>
      </section>
    </main>

    <footer class="carro-footer">
      <div class="carro-footer-inner">
        <div>
          <p class="carro-footer-copy">© 2026 Autodealer. Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
